[project]
name = "hermes-plugin-hindsight"
version = "1.0.1"
description = "Hermes Agent memory provider plugin: hindsight"
requires-python = ">=3.11"
license = { text = "MIT" }
# Installed into the Hermes venv by `hermes plugins install` / `enable` and re-applied after
# every `hermes update`. Keep upper bounds: Hermes pins its own deps exactly and refuses a
# plugin whose requirements cannot resolve against them.
dependencies = [
    # Floor is 0.10.1, not the 0.6.1 this plugin actually needs at the API level:
    # hindsight-embed 0.10.0 shipped a probe that ran `asyncio.run` on the caller's
    # thread, clearing its event loop, so the next hindsight-client call hit an aiohttp
    # session bound to a dead loop ("Timeout context manager should be used inside a
    # task"). That breaks local_embedded outright. Anyone who installed between
    # 2026-09-14 and 2026-09-21 is pinned to the broken release until a floor moves them
    # off it, so keep these at >=0.10.1 rather than widening them back.
    "hindsight-client>=0.10.1,<1",
    "hindsight-embed>=0.10.1,<1",
]

# The plugin is loaded from a directory by Hermes, not installed as a distribution.
[tool.uv]
package = false

[tool.setuptools.packages.find]
where = ["."]
include = ["hindsight*"]
exclude = ["setup.py"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
ignore = [
    "BLE001",  # Broad exception catches are intentional for robustness (health checks, daemon startup)
    "PLW0127",  # Self-assignment is intentional for test patching (re-exported module vars)
    "F401",  # Unused imports are re-exported for test patching
    "RUF100",  # noqa directives for S310 are intentional for security audit
    "S110",  # try-except-pass is intentional for optional dependency handling
    "FURB162",  # timezone replacement is intentional for compatibility
    "SIM115",  # File opening without context manager is intentional for long-lived file handles
    "UP017",  # datetime.UTC alias not available in all Python versions
    "UP035",  # Callable from typing is used for compatibility
    "C408",  # dict() call is intentional for readability
    "PIE807",  # Lambda over list/dict is intentional for lazy evaluation
    "RUF059",  # Unused variable in test is intentional for API consistency
]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "PIE", # flake8-pie
    "RUF", # ruff-specific rules
]
