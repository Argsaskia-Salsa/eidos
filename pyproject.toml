[project]
name = "eidos-monorepo"
version = "0.1.0"
requires-python = ">=3.11"

[tool.uv.workspace]
members = [
    "shared",
    "services/*",
    "hermes/plugins/*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true