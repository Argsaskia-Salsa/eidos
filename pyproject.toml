[project]
name = "hermes-plugin-body-bridge"
version = "0.1.0"
description = "Forward Hermes agent events to coupling-body Agent Channel for reflexd"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1",
]

# The plugin is loaded from a directory by Hermes, not installed as a distribution.
[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"