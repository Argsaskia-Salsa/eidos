[project]
name = "hermes-plugin-body-bridge"
version = "0.2.0"
description = "Forward Hermes agent events to coupling-body Agent Channel for reflexd"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27,<1",
]

# The plugin is loaded from a directory by Hermes, not installed as a distribution.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5.0",
    "aiohttp>=3.9",
    "pytest-order>=1.2"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Run unit tests first to avoid state leakage from integration tests
test_order = [
    "test_unit.py",
    "test_integration.py"
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "T20", # flake8-print (print statements)
]
ignore = [
    "S101", # assert used (allowed in tests)
    "T201", # print used (allowed in tests)
]
exclude = [
    ".git",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "T201"]
