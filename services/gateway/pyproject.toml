[project]
name = "eidos-gateway-service"
version = "0.1.0"
description = "Gateway service wrapper for stackchan-mcp (production StackChan MCP gateway)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "stackchan-mcp",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true