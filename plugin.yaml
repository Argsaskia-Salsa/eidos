name: body_bridge
version: "0.2.0"
description: "Forward Hermes agent events to coupling-body Agent Channel for reflexd"
author: "Erika"
provides_hooks:
  - post_gateway_admission
  - post_llm_call
  - gateway_platform_event
  - on_stream_start
  - on_stream_delta
  - on_stream_end
  - pre_gateway_dispatch
  - on_session_end
  - on_session_finalize
  - api_request_error
provides_middleware:
  - llm_execution
config:
  REFLEXD_MCP_URL:
    type: string
    default: "http://localhost:8770/mcp"
    description: "reflexd MCP endpoint URL"
  REFLEXD_TIMEOUT_SECONDS:
    type: number
    default: 1.0
    description: "HTTP request timeout in seconds"